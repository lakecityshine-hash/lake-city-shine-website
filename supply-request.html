<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Supply / Equipment Request</title><link rel="stylesheet" href="portal.css"></head><body><header><div class="brand">LAKE CITY <span>SHINE</span></div><h1>Supply / Equipment Request</h1></header><main><a href="employee-portal.html">← Portal</a><div class=card><label>Request Type</label><select id=type><option value=low_supply>Low / Out of Supply</option><option value=equipment_problem>Equipment Problem</option><option value=other>Other</option></select><label>Item / Equipment</label><input id=item><label>Details / quantity / urgency</label><textarea id=description></textarea><button onclick="submitSupply()">Submit Request</button><p id=msg></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-portal.js?v=prod15"></script><script>let emp;(async()=>emp=await requirePortalUser())();async function submitSupply(){if(!item.value.trim())return msg.textContent="Enter the item or equipment.";const {error}=await lcs.from("supply_equipment_reports").insert({employee_id:emp.id,report_type:type.value,item_name:item.value.trim(),description:description.value.trim()||null,status:"open"});msg.textContent=error?error.message:"Request sent to Admin.";if(!error){item.value="";description.value=""}}</script></body></html>
