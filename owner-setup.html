<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Setup</title><link rel="stylesheet" href="portal.css"></head><body><div class="wrap"><div class="card"><h1>Owner PIN Setup</h1><p>Create your Owner PIN. This page only works until the first Owner account is created.</p><input id="pin" inputmode="numeric" maxlength="8" type="password" placeholder="Choose 4–8 digit PIN"><input id="pin2" inputmode="numeric" maxlength="8" type="password" placeholder="Confirm PIN"><button id="go">Create Owner Access</button><p id="msg"></p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-portal.js"></script><script>
go.onclick=async()=>{const p=pin.value.replace(/\D/g,"");if(p.length<4||p!==pin2.value.replace(/\D/g,"")){msg.textContent="PINs must match and contain at least 4 digits.";msg.className="err";return};try{await api({action:"bootstrap",email:"owner@portal.lakecityshine.com",password:pinPassword(p)});msg.textContent="Owner access created. Redirecting…";msg.className="ok";setTimeout(()=>location.href="login.html",700)}catch(e){msg.textContent=e.message;msg.className="err"}};
</script></body></html>
