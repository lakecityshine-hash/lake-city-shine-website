<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Setup</title><link rel="stylesheet" href="portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><div class="brand">LAKE CITY <span>SHINE</span></div><h1>Owner Setup</h1></header><main><div class="card"><h2>Create Owner Login</h2><p>This works once to connect the Owner/Admin account.</p><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password" minlength="8"><button class="green" id="setup">Create Owner Login</button><p id="msg"></p></div></main><script src="supabase-portal.js"></script><script>
setup.onclick=async()=>{setup.disabled=true;msg.textContent='Creating…';const r=await fetch(SUPABASE_URL+'/functions/v1/portal-admin',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({action:'bootstrap',email:email.value.trim(),password:password.value})});const j=await r.json();if(!r.ok){msg.textContent=j.error||'Setup failed';setup.disabled=false;return;}msg.textContent='Owner login created. Taking you to sign in…';setTimeout(()=>location.href='login.html',900);};
</script></body></html>
