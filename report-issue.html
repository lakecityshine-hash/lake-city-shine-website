<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Report a Problem</title><link rel="stylesheet" href="portal.css"></head><body><header><div class="brand">LAKE CITY <span>SHINE</span></div><h1>Report a Problem</h1></header><main><a href="employee-portal.html">← Portal</a><div class=card><label>Issue Type</label><select id=category><option value=damage>Existing damage</option><option value=safety_hazard>Safety hazard</option><option value=customer_concern>Customer / property concern</option><option value=equipment_problem>Equipment problem</option><option value=missing_supplies>Missing supplies</option><option value=other>Other</option></select><label>Job / Property</label><input id=job><label>What happened?</label><textarea id=description></textarea><label>Photo (optional)</label><input id=photo type=file accept="image/*"><button onclick="submitIssue()">Submit Issue</button><p id=msg></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-portal.js?v=prod15"></script><script>let emp;(async()=>emp=await requirePortalUser())();async function submitIssue(){if(!description.value.trim())return msg.textContent="Describe the issue.";let path=null,f=photo.files[0];msg.textContent="Submitting…";if(f){if(f.size>10485760)return msg.textContent="Photo must be under 10 MB.";const ext=(f.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"");path=`${emp.id}/${crypto.randomUUID()}.${ext}`;const {error:u}=await lcs.storage.from("issue-photos").upload(path,f,{contentType:f.type||"image/jpeg"});if(u)return msg.textContent=u.message}const {error}=await lcs.from("issue_reports").insert({employee_id:emp.id,category:category.value,job_reference:job.value.trim()||null,description:description.value.trim(),status:"open",photo_storage_path:path});msg.textContent=error?error.message:"Issue sent to Admin.";if(!error){description.value="";photo.value=""}}</script></body></html>
