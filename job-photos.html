<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Job Photos</title><link rel="stylesheet" href="portal.css"></head><body><header><div class="brand">LAKE CITY <span>SHINE</span></div><h1>Job Photos</h1></header><main><a href="employee-portal.html">← Portal</a><div class=card><label>Property Address / Job</label><input id=property><label>Unit</label><input id=unit><label>Service Type</label><input id=service><label>Photo Type</label><select id=category><option value=before>Before</option><option value=during>During</option><option value=after>After</option></select><label>Photo</label><input id=photo type=file accept="image/*"><label>Notes</label><textarea id=notes></textarea><button onclick="submitPhoto()">Submit Job Photo</button><p id=msg></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-portal.js?v=prod6"></script><script>let emp;(async()=>emp=await requirePortalUser())();async function submitPhoto(){const f=photo.files[0];if(!property.value.trim()||!f)return msg.textContent="Enter the job/property and choose a photo.";if(f.size>10485760)return msg.textContent="Photo must be under 10 MB.";msg.textContent="Uploading…";const {data:g,error}=await lcs.from("job_photo_groups").insert({employee_id:emp.id,job_reference:property.value.trim(),property_address:property.value.trim(),unit_number:unit.value.trim()||null,service_type:service.value.trim()||null,notes:notes.value.trim()||null}).select("id").single();if(error)return msg.textContent=error.message;const ext=(f.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,""),path=`${emp.id}/${g.id}/${crypto.randomUUID()}.${ext}`;const {error:u}=await lcs.storage.from("job-photos").upload(path,f,{contentType:f.type||"image/jpeg"});if(u)return msg.textContent=u.message;const {error:p}=await lcs.from("job_photos").insert({photo_group_id:g.id,employee_id:emp.id,category:category.value,storage_path:path,caption:notes.value.trim()||null});msg.textContent=p?p.message:"Job photo submitted to Admin.";if(!p){photo.value="";notes.value=""}}</script></body></html>
