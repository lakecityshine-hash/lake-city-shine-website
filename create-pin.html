<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Your PIN</title><link rel="stylesheet" href="portal.css"></head><body><header><div class="brand">LAKE CITY <span>SHINE</span></div><h1>Create Your PIN</h1></header><main><div class="card" style="max-width:420px;margin:30px auto"><p>Your employee account must already be approved. You choose your own PIN.</p><label>Your Name</label><input id="setupName"><label>Choose PIN</label><input id="newPin" class="pin" type="password" inputmode="numeric" maxlength="8"><label>Confirm PIN</label><input id="confirmPin" class="pin" type="password" inputmode="numeric" maxlength="8"><button style="width:100%" onclick="makePin()">Create PIN</button><p>PIN must be 4–8 digits.</p></div></main><script src="portal.js"></script></body></html>
