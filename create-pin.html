<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Create a PIN</title><link rel="stylesheet" href="portal.css"></head><body><header><div class="brand">LAKE CITY <span>SHINE</span></div><h1>Create a PIN</h1></header><main><a href="login.html">← Login</a><div class=card><label>Your full name</label><input id=name><label>Choose a PIN</label><input id=pin type=password inputmode=numeric maxlength=8><label>Confirm PIN</label><input id=confirmPin type=password inputmode=numeric maxlength=8><button onclick="claim()">Create PIN</button><p id=msg></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-portal.js?v=prod11"></script><script>async function claim(){const p=pin.value.replace(/\D/g,"");if(p!==confirmPin.value.replace(/\D/g,""))return msg.textContent="PINs do not match.";try{await api({action:"claim_pin",name:name.value,pin:p});msg.textContent="PIN created. You can sign in now.";setTimeout(()=>location.href="login.html",800)}catch(e){msg.textContent=e.message}}</script></body></html>
