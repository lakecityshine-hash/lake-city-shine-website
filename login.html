<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Employee Portal | Lake City Shine</title><link rel="stylesheet" href="portal.css"></head>
<body><main class="wrap"><div class="card">
<h1>Employee Portal</h1><p class="muted">Enter your PIN to sign in.</p>
<form id="loginForm"><label for="loginPin">PIN</label><input id="loginPin" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" type="password" autocomplete="current-password" required><button id="signIn" type="submit">Sign In</button><p id="loginMsg" role="status"></p></form>
<button id="openCreate" type="button" aria-expanded="false" aria-controls="createPanel">Create a PIN</button>
<section id="createPanel" hidden><h2>Create your PIN</h2><p class="muted">Cole must add your name first. Enter it exactly as it was added, then choose your PIN.</p>
<form id="createForm"><label for="createName">Your name</label><input id="createName" type="text" autocomplete="name" placeholder="Your name" required><label for="newPin">Choose your PIN</label><input id="newPin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" autocomplete="new-password" placeholder="4–8 digits" required><button id="createBtn" type="submit">Save My PIN</button><p id="createMsg" role="status"></p></form></section>
<p><a class="muted" href="index.html">Back to website</a></p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-portal.js?v=pin-setup-20260930"></script>
<script>
const byId=id=>document.getElementById(id);
const loginForm=byId('loginForm'),loginPin=byId('loginPin'),signIn=byId('signIn'),loginMsg=byId('loginMsg'),openCreate=byId('openCreate'),createPanel=byId('createPanel'),createForm=byId('createForm'),createName=byId('createName'),newPin=byId('newPin'),createBtn=byId('createBtn'),createMsg=byId('createMsg');
function message(el,text,error=false){el.textContent=text;el.className=error?'err':'muted'}
openCreate.onclick=()=>{createPanel.hidden=!createPanel.hidden;openCreate.setAttribute('aria-expanded',String(!createPanel.hidden));if(!createPanel.hidden)createName.focus()};
if(location.hash==='#create'){openCreate.click()}
loginForm.onsubmit=async event=>{
 event.preventDefault();const pin=loginPin.value;if(!/^\d{4,8}$/.test(pin)){message(loginMsg,'Enter your 4–8 digit PIN.',true);return}
 signIn.disabled=true;message(loginMsg,'Checking PIN…');
 try{const x=await api({action:'names'});for(const e of x.employees||[]){if(!e.login_email)continue;const {data,error}=await lcs.auth.signInWithPassword({email:e.login_email,password:pinPassword(pin)});if(!error&&data.session){location.href='employee-portal.html?v=pin-setup-20260930';return}}
 message(loginMsg,'PIN is incorrect. If this is your first visit, choose Create a PIN.',true);
 }catch(error){message(loginMsg,'Unable to connect. Please try again.',true)}finally{signIn.disabled=false}
};
createForm.onsubmit=async event=>{
 event.preventDefault();const name=createName.value.trim(),pin=newPin.value;if(!name||!/^\d{4,8}$/.test(pin)){message(createMsg,'Enter your name and a PIN of 4–8 digits.',true);return}
 createBtn.disabled=true;message(createMsg,'Creating your PIN…');
 try{await api({action:'claim_pin',name,pin});createForm.reset();createPanel.hidden=true;openCreate.setAttribute('aria-expanded','false');message(loginMsg,'PIN created. Sign in with your new PIN.');loginPin.focus()}
 catch(error){message(createMsg,error.message||'Unable to create PIN. Please try again.',true)}finally{createBtn.disabled=false}
};
</script></body></html>
