<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Login | Lake City Shine</title><link rel="stylesheet" href="portal.css"></head><body><div class="wrap"><div class="card"><h1>Employee Portal</h1><p class="muted">Select your name and enter your PIN.</p><select id="who"><option>Loading employees…</option></select><input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="8" type="password" placeholder="PIN"><button id="go">Sign In</button><p id="msg"></p><a class="muted" href="owner-setup.html">Owner setup</a></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-portal.js"></script><script>
(async()=>{try{const x=await api({action:"names"});who.innerHTML='<option value="">Select your name</option>'+x.employees.map(e=>`<option value="${e.login_email||''}">${e.first_name} ${e.last_name||''}</option>`).join('')}catch(e){msg.textContent=e.message;msg.className="err"}})();
go.onclick=async()=>{msg.textContent="";const email=who.value,p=pin.value.replace(/\D/g,"");if(!email||p.length<4){msg.textContent="Select your name and enter your PIN.";msg.className="err";return}try{const {error}=await lcs.auth.signInWithPassword({email,password:pinPassword(p)});if(error)throw error;location.href="employee-portal.html"}catch(e){msg.textContent="Name or PIN is incorrect.";msg.className="err"}};
</script></body></html>
