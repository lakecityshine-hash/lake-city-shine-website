<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Login | Lake City Shine</title><link rel="stylesheet" href="portal.css"></head><body>
<div class="wrap">
 <div class="card"><h1>Employee Portal</h1><p class="muted">Enter your name and PIN.</p>
  <input id="name" autocomplete="name" placeholder="Your name">
  <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="8" type="password" placeholder="PIN">
  <button id="go">Sign In</button><p id="msg"></p>
 </div>
 <div class="card"><h2>Create a PIN</h2><p class="muted">First time here? Use the temporary PIN your administrator gave you, then choose your own PIN.</p>
  <input id="cname" placeholder="Your name">
  <input id="temp" inputmode="numeric" maxlength="8" type="password" placeholder="Temporary PIN">
  <input id="newpin" inputmode="numeric" maxlength="8" type="password" placeholder="Create new 4–8 digit PIN">
  <input id="confirm" inputmode="numeric" maxlength="8" type="password" placeholder="Confirm new PIN">
  <button id="createPin">Create My PIN</button><p id="cmsg"></p>
  <a class="muted" href="owner-setup.html">First-time Owner setup</a>
 </div>
</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-portal.js"></script><script>
let directory=[];
async function directoryLoad(){try{const x=await api({action:"names"});directory=x.employees||[]}catch(e){msg.textContent=e.message;msg.className="err"}}
function findPerson(v){const q=v.trim().toLowerCase().replace(/\s+/g," ");return directory.find(e=>((e.first_name+" "+(e.last_name||"")).trim().toLowerCase()===q)||(e.first_name.toLowerCase()===q))}
directoryLoad();
go.onclick=async()=>{const e=findPerson(name.value),p=pin.value.replace(/\D/g,"");if(!e||p.length<4){msg.textContent="Name or PIN is incorrect.";msg.className="err";return}try{const {error}=await lcs.auth.signInWithPassword({email:e.login_email,password:pinPassword(p)});if(error)throw error;location.href="employee-portal.html"}catch(e){msg.textContent="Name or PIN is incorrect.";msg.className="err"}};
createPin.onclick=async()=>{const e=findPerson(cname.value),old=temp.value.replace(/\D/g,""),np=newpin.value.replace(/\D/g,""),cp=confirm.value.replace(/\D/g,"");if(!e||old.length<4){cmsg.textContent="Enter your name and temporary PIN.";cmsg.className="err";return}if(np.length<4||np!==cp){cmsg.textContent="Your new PIN must be 4–8 digits and both entries must match.";cmsg.className="err";return}try{const {data,error}=await lcs.auth.signInWithPassword({email:e.login_email,password:pinPassword(old)});if(error)throw error;const {error:uerr}=await lcs.auth.updateUser({password:pinPassword(np)});if(uerr)throw uerr;await lcs.auth.signOut();cmsg.textContent="PIN created. You can sign in above.";cmsg.className="ok";temp.value=newpin.value=confirm.value=""}catch(e){cmsg.textContent="Temporary PIN is incorrect.";cmsg.className="err"}};
</script></body></html>
