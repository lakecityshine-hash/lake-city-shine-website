<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Employee Login | Lake City Shine</title><link rel="stylesheet" href="portal.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><div class="brand">LAKE CITY <span>SHINE</span></div><h1>Employee Portal</h1></header>
<main><div class="card"><h2>Secure Sign In</h2><p>Use your employee email and password.</p>
<label>Email</label><input id="email" type="email" autocomplete="email">
<label>Password</label><input id="password" type="password" autocomplete="current-password">
<button class="green" id="go">Sign In</button><p id="msg"></p><p><a href="owner-setup.html">First-time Owner/Admin setup</a></p></div></main>
<script src="supabase-portal.js"></script><script>
go.onclick=async()=>{msg.textContent='Signing in…';const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});
if(error){msg.textContent=error.message;return;} const e=await requirePortalUser(); if(e)location.href='employee-portal.html';};
</script></body></html>
