<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Employee Portal</title><link rel="stylesheet" href="portal.css"></head><body><header><div class="brand">LAKE CITY <span>SHINE</span></div><h1>Employee Portal</h1></header><main><div class=card><h2>Employee Portal</h2><p>Enter your PIN.</p><label>PIN</label><input id=pin type=password inputmode=numeric maxlength=8><button onclick="login()">Sign In</button><p id=msg></p></div><div class=card><h2>First time here?</h2><a class=btn href="create-pin.html">Create a PIN</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-portal.js?v=prod11"></script><script>let directory=[];(async()=>{try{directory=(await api({action:"names"})).employees||[]}catch(e){msg.textContent=e.message}})();async function login(){msg.textContent="Signing in…";const p=pin.value.replace(/\D/g,"");if(!/^\d{4,8}$/.test(p))return msg.textContent="Enter your 4–8 digit PIN.";for(const e of directory){if(!e.login_email)continue;const {data,error}=await lcs.auth.signInWithPassword({email:e.login_email,password:pinPassword(p)});if(!error&&data.session){location.href="employee-portal.html";return}}msg.textContent="PIN not recognized."}</script></body></html>
