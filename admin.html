<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner / Admin | Lake City Shine</title><link rel="stylesheet" href="portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.record{border-top:1px solid #ddd;padding:12px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo{max-width:100%;border-radius:10px;margin-top:8px}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><header><div class="brand">LAKE CITY <span>SHINE</span></div><h1>Owner / Admin</h1></header><main><a href="employee-portal.html">← Portal</a>
<div class="card"><h2>Employee Control</h2><div class="row"><div><label>First Name</label><input id="first"></div><div><label>Last Name</label><input id="last"></div></div><label>Employee Email</label><input id="email" type="email"><label>Temporary Password</label><input id="temp" type="password" minlength="8"><label>Access</label><select id="role"><option value="employee">Employee</option><option value="admin">Owner / Admin</option></select><button class="green" id="add">Add Employee</button><p id="emsg"></p><div id="employees">Loading…</div></div>
<div class="card"><h2>Time Punches</h2><div id="times">Loading…</div></div><div class="card"><h2>Job Photos</h2><div id="photos">Loading…</div></div></main>
<script src="supabase-portal.js"></script><script>
let token='';(async()=>{const me=await requirePortalUser(true);if(!me)return;const {data:{session}}=await sb.auth.getSession();token=session.access_token;loadEmployees();loadTimes();loadPhotos();})();
async function api(body){const r=await fetch(SUPABASE_URL+'/functions/v1/portal-admin',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+token},body:JSON.stringify(body)});return [r,await r.json()]}
add.onclick=async()=>{add.disabled=true;emsg.textContent='Adding…';const [r,j]=await api({action:'create',first_name:first.value.trim(),last_name:last.value.trim(),email:email.value.trim(),password:temp.value,role:role.value});emsg.textContent=r.ok?'Employee added.':j.error;add.disabled=false;if(r.ok){first.value=last.value=email.value=temp.value='';loadEmployees();}};
async function loadEmployees(){const [r,j]=await api({action:'list'});if(!r.ok){employees.textContent=j.error;return}employees.innerHTML=j.employees.map(e=>`<div class="record"><b>${e.first_name} ${e.last_name||''}</b> <span class="badge">${e.role}</span><br>${e.active?'Active':'Disabled'}<br><button onclick="toggleEmp('${e.id}',${!e.active})">${e.active?'Disable':'Enable'}</button> <button onclick="setRole('${e.id}','${e.role==='admin'?'employee':'admin'}')">Make ${e.role==='admin'?'Employee':'Admin'}</button> <button onclick="resetPass('${e.id}')">Reset Password</button></div>`).join('')||'No employees.'}
async function toggleEmp(id,active){await api({action:'update',id,active});loadEmployees()} async function setRole(id,role){await api({action:'update',id,role});loadEmployees()} async function resetPass(id){const p=prompt('Enter a new temporary password (8+ characters)');if(!p)return;const [r,j]=await api({action:'password',id,password:p});alert(r.ok?'Password updated.':j.error)}
async function loadTimes(){const {data,error}=await sb.from('time_entries').select('id,clock_in,clock_out,employees(first_name,last_name)').order('clock_in',{ascending:false}).limit(100);if(error){times.textContent=error.message;return}times.innerHTML=(data||[]).map(x=>`<div class="record"><b>${x.employees?.first_name||'Employee'} ${x.employees?.last_name||''}</b><br>In: ${new Date(x.clock_in).toLocaleString()}<br>Out: ${x.clock_out?new Date(x.clock_out).toLocaleString():'CLOCKED IN'}</div>`).join('')||'No punches yet.'}
async function loadPhotos(){const {data,error}=await sb.from('job_photos').select('storage_path,category,caption,uploaded_at,employees(first_name,last_name),job_photo_groups(property_address,unit_number,service_type)').order('uploaded_at',{ascending:false}).limit(100);if(error){photos.textContent=error.message;return}photos.innerHTML='';for(const x of data||[]){const {data:s}=await sb.storage.from('job-photos').createSignedUrl(x.storage_path,3600);const g=x.job_photo_groups||{};photos.innerHTML+=`<div class="record"><b>${x.employees?.first_name||'Employee'} ${x.employees?.last_name||''}</b><br>${g.property_address||''}${g.unit_number?' — Unit '+g.unit_number:''}<br>${g.service_type||''} • ${x.category} • ${new Date(x.uploaded_at).toLocaleString()}${x.caption?'<br>'+x.caption:''}${s?.signedUrl?`<br><img class="photo" src="${s.signedUrl}">`:''}</div>`}if(!(data||[]).length)photos.textContent='No photos yet.'}
</script></body></html>
