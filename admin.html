<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Owner / Admin</title><link rel="stylesheet" href="portal.css"></head><body><header><div class="brand">LAKE CITY <span>SHINE</span></div><h1>Owner / Admin</h1></header><main><a href="employee-portal.html">← Portal</a>
<div class=card><h2>Employee Management</h2><div class=grid2><div><label>First Name</label><input id=first></div><div><label>Last Name</label><input id=last></div></div><label>Role</label><select id=role><option value=employee>Employee</option><option value=admin>Admin</option></select><button onclick="addEmployee()">Add Employee</button><p>New employees use <b>Create a PIN</b> on their first login.</p><div id=employees></div></div>
<div class=card><h2>Time Punches</h2><div id=punches>Loading…</div></div>
<div class=card><h2>Completed Checklists</h2><div id=checklists>Loading…</div></div>
<div class=card><h2>Job Photos</h2><div id=photos>Loading…</div></div>
<div class=card><h2>Reported Problems</h2><div id=issues>Loading…</div></div>
<div class=card><h2>Supply / Equipment Requests</h2><div id=supplies>Loading…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-portal.js?v=prod2"></script><script>
let session,elist=[];(async()=>{const x=await me(true);session=x.session;await refreshAll()})();
function nameOf(id){const e=elist.find(e=>e.id===id);return e?fullName(e):"Employee"}
async function refreshAll(){await loadEmployees();await Promise.all([loadPunches(),loadChecklists(),loadPhotos(),loadIssues(),loadSupplies()])}
async function loadEmployees(){const x=await api({action:"list"},session.access_token);elist=x.employees||[];employees.innerHTML=elist.map(e=>`<div class=row><b>${esc(fullName(e))}</b> — ${esc(e.role)} — ${e.active?"Active":"Disabled"}<br><button onclick="toggleEmployee('${e.id}',${!e.active})">${e.active?"Disable":"Enable"}</button>${e.auth_user_id?` <button onclick="resetPin('${e.id}')">Reset PIN</button>`:" <span>Waiting for first PIN setup</span>"}</div>`).join("")}
async function addEmployee(){try{await api({action:"create",first_name:first.value,last_name:last.value,role:role.value,permissions:{time_clock:true,checklists:true,chemicals_sds:true,job_photos:true,report_issue:true,supply_request:true,policies:true}},session.access_token);first.value=last.value="";await loadEmployees()}catch(e){alert(e.message)}}
async function toggleEmployee(id,active){try{await api({action:"update",id,active},session.access_token);await loadEmployees()}catch(e){alert(e.message)}}
async function resetPin(id){const p=prompt("Enter a new 4–8 digit PIN.");if(!/^\d{4,8}$/.test(p||""))return alert("PIN must be 4–8 digits.");try{await api({action:"password",id,password:pinPassword(p)},session.access_token);alert("PIN reset.")}catch(e){alert(e.message)}}
async function loadPunches(){const {data,error}=await lcs.from("time_entries").select("*").order("clock_in",{ascending:false}).limit(200);punches.innerHTML=error?esc(error.message):(data||[]).map(x=>`<div class=row><b>${esc(nameOf(x.employee_id))}</b><br>${fmt(x.clock_in)} → ${x.clock_out?fmt(x.clock_out):"<b>Still clocked in</b>"}${x.edited?" • Edited":""}</div>`).join("")||"<p>No punches yet.</p>"}
async function loadChecklists(){const {data,error}=await lcs.from("checklist_sessions").select("id,employee_id,job_reference,started_at,completed_at,employee_notes,checklist_templates(name),checklist_responses(completed,checklist_items(item_text))").order("started_at",{ascending:false}).limit(100);checklists.innerHTML=error?esc(error.message):(data||[]).map(x=>`<div class=row><b>${esc(nameOf(x.employee_id))} — ${esc(x.checklist_templates?.name||"Checklist")}</b><br>${esc(x.job_reference||"No job entered")}<br><small>${fmt(x.completed_at||x.started_at)}</small><br>${(x.checklist_responses||[]).filter(r=>r.completed).length}/${(x.checklist_responses||[]).length} tasks completed${x.employee_notes?`<p>${esc(x.employee_notes)}</p>`:""}</div>`).join("")||"<p>No completed checklists yet.</p>"}
async function loadPhotos(){const {data,error}=await lcs.from("job_photos").select("*,job_photo_groups(property_address,unit_number,service_type,notes)").order("uploaded_at",{ascending:false}).limit(100);if(error)return photos.innerHTML=esc(error.message);const rows=await Promise.all((data||[]).map(async x=>({...x,url:await signed("job-photos",x.storage_path)})));photos.innerHTML=rows.map(x=>`<div class=row><b>${esc(nameOf(x.employee_id))} — ${esc(x.category)}</b><br>${esc(x.job_photo_groups?.property_address||"")} ${x.job_photo_groups?.unit_number?"• Unit "+esc(x.job_photo_groups.unit_number):""}<br>${esc(x.job_photo_groups?.service_type||"")}<br><small>${fmt(x.uploaded_at)}</small>${x.caption?`<p>${esc(x.caption)}</p>`:""}${x.url?`<img class=thumb src="${x.url}">`:""}</div>`).join("")||"<p>No job photos yet.</p>"}
async function loadIssues(){const {data,error}=await lcs.from("issue_reports").select("*").order("created_at",{ascending:false}).limit(100);if(error)return issues.innerHTML=esc(error.message);const rows=await Promise.all((data||[]).map(async x=>({...x,url:await signed("issue-photos",x.photo_storage_path)})));issues.innerHTML=rows.map(x=>`<div class=row><b>${esc(nameOf(x.employee_id))} — ${esc(x.category)}</b><br>${esc(x.job_reference||"")}<br><small>${fmt(x.created_at)}</small><p>${esc(x.description)}</p>${x.url?`<img class=thumb src="${x.url}">`:""}<label>Status</label><select onchange="issueStatus('${x.id}',this.value)"><option value=open ${x.status==="open"?"selected":""}>Open</option><option value=reviewing ${x.status==="reviewing"?"selected":""}>Reviewing</option><option value=resolved ${x.status==="resolved"?"selected":""}>Resolved</option></select></div>`).join("")||"<p>No reported problems yet.</p>"}
async function issueStatus(id,status){const {error}=await lcs.from("issue_reports").update({status,resolved_at:status==="resolved"?new Date().toISOString():null}).eq("id",id);if(error)alert(error.message);await loadIssues()}
async function loadSupplies(){const {data,error}=await lcs.from("supply_equipment_reports").select("*").order("created_at",{ascending:false}).limit(100);supplies.innerHTML=error?esc(error.message):(data||[]).map(x=>`<div class=row><b>${esc(nameOf(x.employee_id))} — ${esc(x.item_name)}</b><br>${esc(x.report_type)}<br><small>${fmt(x.created_at)}</small>${x.description?`<p>${esc(x.description)}</p>`:""}<label>Status</label><select onchange="supplyStatus('${x.id}',this.value)"><option value=open ${x.status==="open"?"selected":""}>Open</option><option value=resolved ${x.status==="resolved"?"selected":""}>Resolved</option></select></div>`).join("")||"<p>No supply/equipment requests yet.</p>"}
async function supplyStatus(id,status){const {error}=await lcs.from("supply_equipment_reports").update({status,resolved_at:status==="resolved"?new Date().toISOString():null}).eq("id",id);if(error)alert(error.message);await loadSupplies()}
</script></body></html>
