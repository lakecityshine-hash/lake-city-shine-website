<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner / Admin</title><link rel="stylesheet" href="portal.css"></head><body><header><div class="brand">LAKE CITY <span>SHINE</span></div><h1>Owner / Admin</h1></header><main><a href="employee-portal.html">← Portal</a><div class="card"><h2>Employee Access</h2><p>Employees set their own PIN. Owner/Admin controls account status and clearance level.</p><div id="list"></div></div><script>let u=guard(true);if(u){list.innerHTML=D().employees.map(e=>`<p><b>${e.name}</b> — <span class="badge">${e.level}</span> — PIN: ${e.pin?'Set':'Not set'} — ${e.active?'Active':'Disabled'}</p>`).join('')}</script></main><script src="portal.js"></script></body></html>
