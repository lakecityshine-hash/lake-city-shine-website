<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Management</title><link rel="stylesheet" href="portal.css"></head><body><div class="wrap"><div class="card"><h1>Employee Management</h1><p class="muted">Add employees, set access, reset PINs, and enable/disable accounts.</p><input id="fn" placeholder="First name"><input id="ln" placeholder="Last name (optional)"><input id="newpin" inputmode="numeric" maxlength="8" placeholder="4–8 digit PIN"><select id="role"><option value="employee">Employee</option><option value="admin">Admin</option></select><button id="add">Add Employee</button><p id="msg"></p></div><div class="card"><h2>Employees</h2><div id="employees">Loading…</div></div><div class="card"><h2>Time Punches</h2>
<p class="muted">View employee clock-in and clock-out records.</p>
<div class="grid"><input id="punchDate" type="date"><select id="punchEmployee"><option value="">All employees</option></select></div>
<button id="refreshPunches">Refresh Punches</button>
<div id="punches">Loading…</div></div><div class="card"><a class="btn" href="employee-portal.html">Back to Portal</a></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-portal.js"></script><script>
const permKeys={time_clock:"Time Clock",checklists:"Checklists",chemicals_sds:"Chemicals & SDS",job_photos:"Job Photos",report_issue:"Report Issue",supply_request:"Supply Request",policies:"Policies"};
let session;
async function call(body){return api(body,session.access_token)}
function alias(){return "emp-"+crypto.randomUUID()+"@portal.lakecityshine.com"}
function permsFrom(el){const o={};el.querySelectorAll("[data-p]").forEach(x=>o[x.dataset.p]=x.checked);return o}
async function load(){const x=await call({action:"list"});employees.innerHTML="";x.employees.forEach(e=>{const box=document.createElement("div");box.className="employee";box.innerHTML=`<b>${e.first_name} ${e.last_name||""}</b><br><span class="muted">${e.role} · ${e.active?"Active":"Disabled"}</span><select class="r"><option value="employee">Employee</option><option value="admin">Admin</option></select><div class="perms">${Object.entries(permKeys).map(([k,v])=>`<label class="perm"><input type="checkbox" data-p="${k}" ${e.permissions?.[k]===false?"":"checked"}>${v}</label>`).join("")}</div><input class="rp" inputmode="numeric" maxlength="8" placeholder="New PIN"><button class="save">Save permissions / role</button><button class="reset">Reset PIN</button><button class="toggle">${e.active?"Disable employee":"Enable employee"}</button>`;box.querySelector(".r").value=e.role;box.querySelector(".save").onclick=async()=>{await call({action:"update",id:e.id,role:box.querySelector(".r").value,permissions:permsFrom(box)});await load()};box.querySelector(".toggle").onclick=async()=>{await call({action:"update",id:e.id,active:!e.active});await load()};box.querySelector(".reset").onclick=async()=>{const p=box.querySelector(".rp").value.replace(/\D/g,"");if(p.length<4)return alert("Enter a 4–8 digit PIN.");await call({action:"password",id:e.id,password:pinPassword(p)});box.querySelector(".rp").value="";alert("PIN reset.");};employees.appendChild(box)})}

async function loadPunches(){
 const {data:rows,error}=await lcs.from("time_entries").select("id,employee_id,clock_in,clock_out,edited,notes").order("clock_in",{ascending:false}).limit(250);
 if(error){punches.innerHTML='<p class="err">'+error.message+'</p>';return}
 const x=await call({action:"list"}); const map=Object.fromEntries(x.employees.map(e=>[e.id,(e.first_name+" "+(e.last_name||"")).trim()]));
 if(punchEmployee.options.length<=1) x.employees.forEach(e=>{const o=document.createElement("option");o.value=e.id;o.textContent=map[e.id];punchEmployee.appendChild(o)});
 const day=punchDate.value, emp=punchEmployee.value;
 const filtered=(rows||[]).filter(r=>(!emp||r.employee_id===emp)&&(!day||new Date(r.clock_in).toLocaleDateString("en-CA")===day));
 punches.innerHTML=filtered.length?filtered.map(r=>`<div class="employee"><b>${map[r.employee_id]||"Employee"}</b><br><span class="muted">${new Date(r.clock_in).toLocaleDateString()} · In: ${new Date(r.clock_in).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})} · Out: ${r.clock_out?new Date(r.clock_out).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}):"<b>Still clocked in</b>"}</span>${r.edited?"<br><span class='muted'>Edited</span>":""}</div>`).join(""):'<p class="muted">No punches match this filter.</p>';
}
refreshPunches.onclick=loadPunches; punchDate.onchange=loadPunches; punchEmployee.onchange=loadPunches;
(async()=>{const x=await me(true);session=x.session;await load();await loadPunches()})();
add.onclick=async()=>{const p=newpin.value.replace(/\D/g,"");if(!fn.value.trim()||p.length<4){msg.textContent="First name and a 4–8 digit PIN are required.";msg.className="err";return};const permissions=Object.fromEntries(Object.keys(permKeys).map(k=>[k,true]));try{await call({action:"create",first_name:fn.value.trim(),last_name:ln.value.trim(),email:alias(),password:pinPassword(p),role:role.value,permissions});fn.value=ln.value=newpin.value="";msg.textContent="Employee added.";msg.className="ok";await load()}catch(e){msg.textContent=e.message;msg.className="err"}};
</script></body></html>
