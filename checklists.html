<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Cleaning Checklists</title><link rel="stylesheet" href="portal.css"></head><body><header><div class="brand">LAKE CITY <span>SHINE</span></div><h1>Cleaning Checklists</h1></header><main><a href="employee-portal.html">← Portal</a><div id=menu class=card><h2>Select a checklist</h2><div id=templateList>Loading…</div></div><div id=detail class=card style="display:none"><button onclick="back()">← All Checklists</button><h2 id=ctitle></h2><label>Job / Property (optional)</label><input id=jobref><div id=tasks></div><label>Notes</label><textarea id=notes></textarea><button onclick="complete()">Submit Completed Checklist</button><p id=msg></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-portal.js?v=prod1"></script><script>let emp,templates=[],current,items=[];(async()=>{emp=await requirePortalUser();const {data,error}=await lcs.from("checklist_templates").select("id,name,description").eq("active",true).order("name");if(error)return templateList.textContent=error.message;templates=data||[];templateList.innerHTML=templates.map(t=>`<button class=btn style="display:block;width:100%;margin:8px 0;text-align:left" onclick="openList('${t.id}')">${esc(t.name)}</button>`).join("")})();async function openList(id){current=templates.find(t=>t.id===id);const {data,error}=await lcs.from("checklist_items").select("*").eq("template_id",id).order("sort_order");if(error)return alert(error.message);items=data||[];ctitle.textContent=current.name;tasks.innerHTML=items.map(i=>`<label class=row style="display:flex;gap:10px"><input type=checkbox data-id="${i.id}"><span>${esc(i.item_text)}</span></label>`).join("");menu.style.display="none";detail.style.display="block"}function back(){detail.style.display="none";menu.style.display="block"}async function complete(){const boxes=[...tasks.querySelectorAll("input")],left=boxes.filter(x=>!x.checked).length;if(left&&!confirm(left+" task(s) are unchecked. Submit anyway?"))return;msg.textContent="Submitting…";const now=new Date().toISOString(),{data:s,error}=await lcs.from("checklist_sessions").insert({template_id:current.id,employee_id:emp.id,job_reference:jobref.value.trim()||null,completed_at:now,employee_notes:notes.value.trim()||null}).select("id").single();if(error)return msg.textContent=error.message;const rows=items.map(i=>{const checked=!!boxes.find(x=>x.dataset.id===i.id)?.checked;return {session_id:s.id,checklist_item_id:i.id,completed:checked,completed_at:checked?now:null}});const {error:e}=await lcs.from("checklist_responses").insert(rows);msg.textContent=e?e.message:"Checklist submitted to Admin.";if(!e)setTimeout(back,700)}</script></body></html>
