<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Cleaning Checklists</title><link rel="stylesheet" href="portal.css">
<style>
.checklist-pick{display:flex;width:100%;margin:9px 0;text-align:left;justify-content:space-between;align-items:center}
.task{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid #e5edf3;align-items:flex-start}
.task input{width:23px;height:23px;flex:none;margin-top:1px}
#detail{display:none} .section{border:1px solid #dce7ed;border-radius:13px;margin:12px 0;overflow:hidden}
.section summary{padding:14px;font-weight:800;cursor:pointer;background:#f7fafc}
.section-body{padding:0 14px} .progress{height:10px;background:#e8eef2;border-radius:99px;overflow:hidden;margin:10px 0}
.progress>div{height:100%;background:#2f8f55;width:0} .sticky{position:sticky;bottom:8px;background:white;padding:10px 0}
.meta{display:grid;gap:9px;margin:12px 0} .meta input{width:100%;box-sizing:border-box}
.small{font-size:.9rem;opacity:.75}
</style></head><body><header><div class="brand">LAKE CITY <span>SHINE</span></div><h1>Cleaning Checklists</h1></header>
<main><a href="employee-portal.html">← Portal</a>
<div id="menu" class="card"><h2>Choose the job checklist</h2><p>Select the type of cleaning you're completing.</p><div id="choices"></div></div>
<div id="detail" class="card">
<button type="button" id="backBtn">← All Checklists</button><h2 id="ctitle"></h2>
<div class="meta"><label>Property / Address<input id="jobRef" placeholder="Address, business, or property name"></label><label>Unit # (if applicable)<input id="unitNo" placeholder="Unit #"></label></div>
<div class="progress"><div id="bar"></div></div><div id="progressText" class="small"></div>
<div id="tasks"></div>
<div class="sticky"><button type="button" id="completeBtn" class="btn">Complete Checklist</button></div>
<div id="msg"></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-portal.js?v=prod11"></script>
<script>
const LISTS={"Move-In Cleaning": {"Before Starting": ["Walk through the property and note any pre-existing damage or unusual conditions.", "Take required BEFORE photos before cleaning begins.", "Confirm electricity and running water are available.", "Gather supplies and equipment and work top-to-bottom, back-to-front."], "Kitchen": ["Clean inside and outside of cabinets and drawers.", "Clean counters, backsplash, sink, faucet and fixtures.", "Clean refrigerator and freezer inside and out; remove and clean safely removable shelves, drawers and bins, then reassemble.", "Clean oven/range inside and out and carefully clean around burners/elements.", "Clean dishwasher interior if included.", "Clean washing machine interior if included.", "Detail appliance exteriors, handles and surrounding surfaces."], "Bathrooms": ["Clean and disinfect toilet completely, including base and exterior.", "Clean vanity, sink, faucet and mirror.", "Clean shower/tub, tile and fixtures; remove soap scum and buildup.", "Wipe doors, handles, switches and reachable vents.", "Detail floor edges and mop floor."], "Rooms & Detail": ["Dust fans, fixtures, vents and high surfaces.", "Wipe doors, frames, handles, switches and outlets.", "Clean interior windows, sills and tracks.", "Wipe baseboards and spot-clean walls.", "Vacuum carpet including edges.", "Sweep/vacuum and mop hard floors."], "Final Walkthrough": ["Check every room for missed dust, streaks, debris or residue.", "Make sure appliances/cabinets are clean, dry and correctly reassembled.", "Take required AFTER photos.", "Remove supplies and trash and leave the property ready for occupancy."]}, "Move-Out Cleaning": {"Before Starting": ["Walk through the entire property and document condition.", "Take clear BEFORE photos of rooms and heavy buildup.", "Check for mold, pests, bodily fluids, needles or other hazards; stop and contact Cole before handling unsafe conditions.", "Confirm utilities are available and note excessive trash or out-of-scope work."], "Kitchen": ["Remove loose food/debris from refrigerator and freezer.", "Remove safely removable refrigerator/freezer shelves, drawers, bins and trays; clean each piece and underneath, then reassemble.", "Clean refrigerator/freezer interior, seals, doors, handles, top and accessible sides.", "Clean stovetop and oven inside/out; do not aggressively scrub burners/elements.", "Clean inside/outside cabinets and drawers.", "Degrease counters, backsplash, sink and fixtures.", "Clean dishwasher and washing machine interiors when included.", "Detail appliance exteriors and surrounding surfaces."], "Bathrooms": ["Clean/disinfect toilet, including base, hinges and exterior.", "Clean vanity, sink, faucet, mirror and cabinet surfaces.", "Clean shower/tub, tile, grout and fixtures; remove soap scum and buildup.", "Wipe doors, handles, switches and reachable vents.", "Detail and mop floors, including edges and behind toilet where accessible."], "Whole Home": ["Dust fans, vents, fixtures, ledges and high surfaces.", "Wipe doors, frames, handles, switches and outlets.", "Clean interior windows, sills and tracks.", "Spot/wash walls as required and wipe baseboards.", "Vacuum carpet and edges.", "Sweep/vacuum and mop hard floors."], "Final Walkthrough": ["Inspect all rooms against the move-out standard.", "Correct streaks, missed debris, fingerprints and residue.", "Take required AFTER photos.", "Leave appliances empty, clean, dry and reassembled; remove cleaning supplies and trash."]}, "Deep Cleaning": {"Before Starting": ["Walk through the home and identify priority/heavy-soil areas.", "Take before photos when needed and note damage or unsafe conditions.", "Confirm any customer-specific priorities before starting."], "Kitchen": ["Degrease counters, backsplash, sink, faucet and cabinet fronts.", "Detail appliance exteriors and clean included appliance interiors.", "Clean cabinet/drawer interiors only when included in the job.", "Detail doors, handles, switches, trim and buildup areas."], "Bathrooms": ["Deep clean/disinfect toilet, vanity, sink, mirror, shower/tub and fixtures.", "Remove soap scum and buildup from tile/grout and surrounding surfaces.", "Detail baseboards, doors, handles, switches and floor edges."], "Living Areas & Bedrooms": ["Dust high-to-low, including fans, fixtures, vents, ledges and reachable surfaces.", "Detail doors, frames, handles, switches and outlets.", "Clean interior windows/sills/tracks when included.", "Wipe baseboards and spot-clean walls.", "Vacuum carpet/edges and mop hard floors."], "Final Walkthrough": ["Check corners, edges, glass, fixtures and high-touch areas.", "Correct any missed buildup, streaks or debris.", "Take after photos when required and leave the home orderly."]}, "Recurring Cleaning": {"Main Areas": ["Dust reachable surfaces, furniture, ledges and fixtures.", "Wipe high-touch surfaces, doors/handles and switches as needed.", "Straighten cleaned areas without moving personal belongings unnecessarily."], "Kitchen": ["Clean counters, backsplash, sink and faucet.", "Wipe appliance exteriors and cabinet fronts as needed.", "Clean stovetop surface and remove visible food/grease.", "Sweep/vacuum and mop floor."], "Bathrooms": ["Clean/disinfect toilet, vanity, sink and faucet.", "Clean mirror and shower/tub surfaces.", "Wipe high-touch areas and mop floor."], "Floors & Final": ["Vacuum carpets/rugs and edges as appropriate.", "Sweep/vacuum and mop hard floors.", "Complete final walkthrough and correct visible misses."]}, "Commercial Cleaning": {"Arrival & Safety": ["Check assigned areas and note damage, hazards or access issues.", "Follow site-specific confidentiality/security requirements.", "Do not open cabinets, drawers or restricted areas unless specifically authorized."], "Offices & Common Areas": ["Empty approved trash/recycling and replace liners.", "Dust/wipe reachable surfaces and high-touch points.", "Clean entry glass and interior glass included in scope.", "Vacuum carpet and mats; sweep/mop hard floors."], "Restrooms": ["Clean/disinfect toilets and urinals.", "Clean sinks, counters, mirrors and fixtures.", "Refill approved consumables if included.", "Clean/disinfect touch points and mop floors."], "Breakroom / Kitchen": ["Clean counters, sink and exterior appliance surfaces.", "Wipe tables and approved touch points.", "Remove trash and clean floors."], "Final Walkthrough": ["Check entrances, restrooms, floors and visible surfaces.", "Secure areas as required and report maintenance/safety concerns.", "Take required completion photos if assigned."]}, "Post-Construction Cleaning": {"Safety & Prep": ["Walk the site and confirm the area is released for cleaning.", "Wear required PPE and do not handle unknown construction hazards.", "Photograph damage or conditions that should be documented before cleaning."], "Debris & Dust": ["Remove approved loose construction debris.", "HEPA/vacuum or remove fine dust from high surfaces, ledges, trim and fixtures.", "Detail doors, frames, handles, switches, outlets and baseboards.", "Clean cabinets, shelving and built-ins inside/out when included."], "Kitchen / Bath / Fixtures": ["Remove dust/residue from counters, sinks, fixtures and installed appliances.", "Detail tubs/showers, toilets, vanities, mirrors and hardware.", "Remove labels/adhesive only with surface-safe methods."], "Glass & Floors": ["Clean included interior glass, windows, sills and tracks.", "Vacuum carpet and edges thoroughly.", "Vacuum/sweep hard floors before damp mopping; repeat as needed for construction dust."], "Final Detail": ["Inspect from multiple angles for dust, smears, stickers and debris.", "Detail corners, edges and touch points.", "Take required final photos and report incomplete construction items separately."]}, "Pressure Washing": {"Before Starting": ["Inspect surface for damage, loose material, electrical hazards and items that need protected.", "Identify staining: dirt, algae/mildew, grease/oil, rust or other.", "Take BEFORE photos and confirm water access.", "Move/protect items in the work area and choose surface-safe pressure/nozzle."], "Cleaning": ["Pre-treat only with an appropriate product for the surface/stain.", "Work methodically with consistent distance and overlap.", "Avoid forcing water into doors, windows, vents, outlets or damaged surfaces.", "Use lower pressure on delicate surfaces and never damage siding, wood, paint or seals."], "Final": ["Rinse surrounding surfaces and remove chemical residue.", "Check for striping, missed edges and remaining stains.", "Return moved items when safe.", "Take AFTER photos and report stains/damage that could not safely be removed."]}, "Apartment / Unit Turnover": {"Before Starting": ["Walk the entire unit before cleaning.", "Take BEFORE photos of each room and heavy buildup.", "Document damage, mold, pests, bodily fluids, needles or unsafe conditions and contact Cole when needed.", "Confirm electricity and running water are available."], "Kitchen": ["Fully detail refrigerator/freezer, removing and cleaning safely removable components before reassembly.", "Clean oven/range, stovetop and surrounding grease/residue.", "Clean inside/outside cabinets and drawers.", "Clean counters, backsplash, sink, faucet and fixtures.", "Clean included dishwasher/washing machine interiors and appliance exteriors."], "Bathroom": ["Clean/disinfect toilet completely.", "Clean vanity, sink, faucet and mirror.", "Clean shower/tub, tile, grout and fixtures.", "Detail doors, handles, switches, baseboards and floor edges."], "Whole Unit": ["Dust fans, vents, fixtures, ledges and high surfaces.", "Wipe doors, frames, handles, switches and outlets.", "Clean interior windows, sills and tracks.", "Spot/wash walls as required and wipe baseboards.", "Vacuum carpet/edges; sweep/vacuum and mop hard floors."], "Inspection Ready": ["Complete a slow final walkthrough room-by-room.", "Correct streaks, residue, missed debris and fingerprints.", "Take AFTER photos.", "Leave appliances/cabinets dry and correctly reassembled; remove supplies/trash and leave unit inspection-ready."]}};
let emp=null,current=null,sessionId=null;
const choices=document.getElementById("choices"),menu=document.getElementById("menu"),detail=document.getElementById("detail"),tasks=document.getElementById("tasks");
Object.keys(LISTS).forEach(name=>{const b=document.createElement("button");b.type="button";b.className="btn checklist-pick";b.innerHTML=`<span>${esc(name)}</span><span>›</span>`;b.onclick=()=>openList(name);choices.appendChild(b)});
(async()=>{try{emp=await requirePortalUser()}catch(e){}})();
function openList(name){
 current=name;sessionId=null;document.getElementById("ctitle").textContent=name;menu.style.display="none";detail.style.display="block";tasks.innerHTML="";
 Object.entries(LISTS[name]).forEach(([section,items],si)=>{
  const d=document.createElement("details");d.className="section";d.open=si===0;
  const sm=document.createElement("summary");sm.textContent=section;d.appendChild(sm);
  const body=document.createElement("div");body.className="section-body";
  items.forEach((txt,i)=>{const row=document.createElement("label");row.className="task";const cb=document.createElement("input");cb.type="checkbox";cb.dataset.task=txt;cb.onchange=updateProgress;const span=document.createElement("span");span.textContent=txt;row.append(cb,span);body.appendChild(row)});
  d.appendChild(body);tasks.appendChild(d);
 });
 updateProgress();window.scrollTo({top:0,behavior:"smooth"});
}
function updateProgress(){
 const all=[...tasks.querySelectorAll('input[type="checkbox"]')],done=all.filter(x=>x.checked).length,pct=all.length?Math.round(done/all.length*100):0;
 document.getElementById("bar").style.width=pct+"%";document.getElementById("progressText").textContent=`${done} of ${all.length} tasks completed (${pct}%)`;
}
document.getElementById("backBtn").onclick=()=>{detail.style.display="none";menu.style.display="block";current=null};
document.getElementById("completeBtn").onclick=async()=>{
 const msg=document.getElementById("msg"),btn=document.getElementById("completeBtn"),all=[...tasks.querySelectorAll('input[type="checkbox"]')],missing=all.filter(x=>!x.checked);
 if(!document.getElementById("jobRef").value.trim()){msg.textContent="Enter the property/address before completing the checklist.";return}
 if(missing.length){msg.textContent=`${missing.length} task${missing.length===1?" is":"s are"} still unchecked.`;missing[0].closest("details").open=true;missing[0].scrollIntoView({behavior:"smooth",block:"center"});return}
 if(!emp){msg.textContent="Your employee session is not ready. Return to the portal and reopen Checklists.";return}
 btn.disabled=true;msg.textContent="Saving checklist…";
 try{
  const ref=[document.getElementById("jobRef").value.trim(),document.getElementById("unitNo").value.trim()&&"Unit "+document.getElementById("unitNo").value.trim()].filter(Boolean).join(" — ");
  const {data:templates}=await lcs.from("checklist_templates").select("id,name").eq("name",current).limit(1);
  let templateId=templates?.[0]?.id||null;
  if(!templateId){const {data:t,error:te}=await lcs.from("checklist_templates").insert({name:current,active:true}).select("id").single();if(te)throw te;templateId=t.id}
  const {data:sess,error:se}=await lcs.from("checklist_sessions").insert({employee_id:emp.id,template_id:templateId,job_reference:ref,completed_at:new Date().toISOString()}).select("id").single();
  if(se)throw se; sessionId=sess.id;
  msg.textContent="✓ Checklist completed and saved.";btn.textContent="Completed ✓";
 }catch(e){msg.textContent=e?.message||"Checklist could not be saved.";btn.disabled=false}
};
</script></body></html>
