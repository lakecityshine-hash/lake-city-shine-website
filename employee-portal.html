<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Portal</title><link rel="stylesheet" href="portal.css"></head><body><div class="wrap"><div class="card"><h1 id="hello">Employee Portal</h1><div class="card" id="clockCard"><h2>Time Clock</h2><p id="clockStatus" class="muted">Checking status…</p><div class="grid"><button id="clockIn">Clock In</button><button id="clockOut">Clock Out</button></div></div><div class="grid" id="links"></div><button onclick="logout()" class="danger">Sign Out</button></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-portal.js"></script><script>
const pages={time_clock:["Time Clock","#clock"],checklists:["Checklists","checklists.html"],chemicals_sds:["Chemicals & SDS","chemicals-sds.html"],job_photos:["Job Photos","job-photos.html"],report_issue:["Report an Issue","report-issue.html"],supply_request:["Supply / Equipment Request","supply-request.html"],policies:["Policies","policies.html"]};
(async()=>{const x=await me();hello.textContent="Hi, "+x.employee.first_name;const p=x.employee.permissions||{};for(const [k,[label,href]] of Object.entries(pages))if(p[k]!==false&&href!=="#clock")links.innerHTML+=`<a class="btn" href="${href}">${label}</a>`;if(x.employee.role==="admin")links.innerHTML+=`<a class="btn" href="admin.html">Owner / Admin</a>`;
const {data:open}=await lcs.from("time_entries").select("id,clock_in").eq("employee_id",x.employee.id).is("clock_out",null).order("clock_in",{ascending:false}).limit(1).maybeSingle();
clockStatus.textContent=open?"Clocked in since "+new Date(open.clock_in).toLocaleTimeString():"Currently clocked out";
clockIn.disabled=!!open; clockOut.disabled=!open;
clockIn.onclick=async()=>{const {error}=await lcs.from("time_entries").insert({employee_id:x.employee.id,clock_in:new Date().toISOString()});if(error)return alert(error.message);location.reload()};
clockOut.onclick=async()=>{if(!open)return;const {error}=await lcs.from("time_entries").update({clock_out:new Date().toISOString()}).eq("id",open.id);if(error)return alert(error.message);location.reload()};})();
</script></body></html>
