<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Employee Portal</title><link rel="stylesheet" href="portal.css"></head><body><header><div class="brand">LAKE CITY <span>SHINE</span></div><h1>Employee Portal</h1></header><main><div class=card><h2 id=hello>Welcome</h2><p id=clockStatus></p><button id=clockBtn onclick="toggleClock()">Loading…</button></div><div class=card><h2>Employee Tools</h2><div id=links></div></div><button onclick="logout()">Sign Out</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-portal.js?v=prod2"></script><script>let emp,openEntry;
(async()=>{
 const helloEl=document.getElementById("hello"), linksEl=document.getElementById("links"), statusEl=document.getElementById("clockStatus"), btnEl=document.getElementById("clockBtn");
 try{
  emp=await requirePortalUser();
  helloEl.textContent="Welcome, "+fullName(emp);
  const p=emp.permissions||{},a=[["checklists","checklists.html","Cleaning Checklists"],["chemicals_sds","chemicals-sds.html","Chemicals & SDS"],["job_photos","job-photos.html","Job Photos"],["report_issue","report-issue.html","Report a Problem"],["supply_request","supply-request.html","Supply / Equipment Request"],["policies","policies.html","Policies"]];
  linksEl.innerHTML=a.filter(x=>p[x[0]]!==false).map(x=>`<a class=btn style="display:block;margin:8px 0" href="${x[1]}">${x[2]}</a>`).join("")+(emp.role==="admin"?'<a class=btn style="display:block;margin:8px 0" href="admin.html">Owner / Admin</a>':"");
  await refreshClock();
 }catch(e){
  helloEl.textContent="Portal could not load";
  statusEl.textContent=e?.message||"Please sign out and sign back in.";
  btnEl.textContent="Retry";
  btnEl.onclick=()=>location.reload();
 }
})();async function refreshClock(){const {data,error}=await lcs.from("time_entries").select("*").eq("employee_id",emp.id).is("clock_out",null).order("clock_in",{ascending:false}).limit(1);if(error)return document.getElementById("clockStatus").textContent=error.message;openEntry=data?.[0];document.getElementById("clockStatus").textContent=openEntry?"Clocked in since "+fmt(openEntry.clock_in):"You are currently clocked out.";document.getElementById("clockBtn").textContent=openEntry?"Clock Out":"Clock In"}async function toggleClock(){document.getElementById("clockBtn").disabled=true;let error;if(openEntry)({error}=await lcs.from("time_entries").update({clock_out:new Date().toISOString()}).eq("id",openEntry.id));else({error}=await lcs.from("time_entries").insert({employee_id:emp.id}));if(error)alert(error.message);await refreshClock();document.getElementById("clockBtn").disabled=false}</script></body></html>
