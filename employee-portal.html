<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Employee Portal | Lake City Shine</title><link rel="stylesheet" href="portal.css"><style>[hidden]{display:none!important}.portal-menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.portal-menu a{display:block;padding:16px;background:#087eb7;color:white;border-radius:8px;text-decoration:none;font-weight:bold}</style></head><body><main class="wrap"><div class="card"><h1 id="greeting">Employee Portal</h1><p id="portalStatus" role="status">Loading your account…</p><nav id="portalMenu" class="portal-menu" aria-label="Portal sections" hidden><a href="admin.html?v=pin-setup-20260930" id="adminLink" hidden>Owner / Admin</a><a data-permission="checklists" href="checklists.html">Checklists</a><a data-permission="chemicals_sds" href="chemicals-sds.html">Chemicals &amp; SDS</a><a data-permission="job_photos" href="job-photos.html">Job Photos</a><a data-permission="report_issue" href="report-issue.html">Report an Issue</a><a data-permission="supply_request" href="supply-request.html">Supply / Equipment Request</a><a data-permission="policies" href="policies.html">Policies</a></nav><section class="card" id="clockCard" hidden><h2>Time Clock</h2><p id="clockStatus" role="status">Checking status…</p><div class="grid"><button id="clockIn" disabled>Clock In</button><button id="clockOut" disabled>Clock Out</button></div></section><p><button id="signOut" class="danger">Sign Out</button> <button id="retry" hidden>Try Again</button></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-portal.js?v=pin-setup-20260930"></script><script>
(()=>{
const el=id=>document.getElementById(id),status=el('portalStatus'),clockStatus=el('clockStatus'),clockIn=el('clockIn'),clockOut=el('clockOut');
el('retry').onclick=()=>location.reload();el('signOut').onclick=()=>logout();
(async()=>{try{
const {employee}=await me();el('greeting').textContent='Hi, '+employee.first_name;const isAdmin=employee.role==='admin';const permissions=employee.permissions||{};
el('adminLink').hidden=!isAdmin;document.querySelectorAll('[data-permission]').forEach(link=>{link.hidden=!isAdmin&&permissions[link.dataset.permission]===false});el('portalMenu').hidden=false;status.textContent=isAdmin?'Owner / Admin access':'Employee access';
if(!isAdmin&&permissions.time_clock===false)return;el('clockCard').hidden=false;
const {data:open,error}=await lcs.from('time_entries').select('id,clock_in').eq('employee_id',employee.id).is('clock_out',null).order('clock_in',{ascending:false}).limit(1).maybeSingle();
if(error){clockStatus.textContent='Unable to load the time clock. Your portal menu is available above.';el('retry').hidden=false;return}
clockStatus.textContent=open?'Clocked in since '+new Date(open.clock_in).toLocaleTimeString():'Currently clocked out';clockIn.disabled=!!open;clockOut.disabled=!open;
async function punch(out){clockIn.disabled=clockOut.disabled=true;try{const result=out?await lcs.from('time_entries').update({clock_out:new Date().toISOString()}).eq('id',open.id):await lcs.from('time_entries').insert({employee_id:employee.id,clock_in:new Date().toISOString()});if(result.error)throw result.error;location.reload()}catch(error){clockStatus.textContent='Unable to save your time. '+error.message;clockIn.disabled=!!open;clockOut.disabled=!open}}
clockIn.onclick=()=>punch(false);clockOut.onclick=()=>punch(true);
}catch(error){status.textContent='Your portal could not finish loading. Please sign out and sign in again, or tap Try Again.';status.className='err';el('retry').hidden=false;}
})();})();
</script></body></html>
