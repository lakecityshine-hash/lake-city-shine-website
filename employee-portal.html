<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Employee Portal</title><link rel="stylesheet" href="portal.css"><link rel="stylesheet" href="schedule-calendar.css?v=16"></head><body><header><div class="brand">LAKE CITY <span>SHINE</span></div><h1>Employee Portal</h1></header><main><div class=card><h2 id=hello>Welcome</h2><p id=clockStatus></p><button id=clockBtn type=button>Loading…</button><p id=clockHint style="margin-top:10px;font-weight:700"></p><div id="shiftSummary" style="margin-top:12px;font-weight:700"></div></div>
<div class=card><h2>My Hours</h2><div id=weekNav style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><button type=button id=prevWeek>← Previous Week</button><button type=button id=currentWeek>Current Week</button><button type=button id=nextWeek>Next Week →</button></div><div id=weekTitle></div><div id=hoursList>Loading hours…</div><div id=weekTotal style="margin-top:12px;font-size:1.15rem;font-weight:800"></div><p style="margin-top:10px">Payroll week: Wednesday through Tuesday. You can review roughly the last month here.</p></div>
<section class="card" id="shiftCalendar" data-admin="false"></section><div class=card><h2>Employee Tools</h2><div id=links></div></div><button onclick="logout()">Sign Out</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-portal.js?v=prod16"></script><script>let emp,openEntry;
(async()=>{
 const helloEl=document.getElementById("hello"), linksEl=document.getElementById("links"), statusEl=document.getElementById("clockStatus"), btnEl=document.getElementById("clockBtn");
 try{
  emp=await requirePortalUser();
  helloEl.textContent="Welcome, "+fullName(emp);
  const p=emp.permissions||{},a=[["checklists","checklists.html","Cleaning Checklists"],["chemicals_sds","chemicals-sds.html","Chemicals & SDS"],["job_photos","job-photos.html","Job Photos"],["report_issue","report-issue.html","Report a Problem"],["supply_request","supply-request.html","Supply / Equipment Request"],["policies","policies.html","Policies"]];
  linksEl.innerHTML=a.filter(x=>p[x[0]]!==false).map(x=>`<a class=btn style="display:block;margin:8px 0" href="${x[1]}">${x[2]}</a>`).join("")+(emp.role==="admin"?'<a class=btn style="display:block;margin:8px 0" href="admin.html">Owner / Admin</a>':"");
  await refreshClock();
 }catch(e){
  helloEl.textContent="Portal could not load";
  statusEl.textContent=e?.message||"Please sign out and sign back in.";
  btnEl.textContent="Retry";
  btnEl.onclick=()=>location.reload();
 }
})();async function refreshClock(){const {data,error}=await lcs.from("time_entries").select("*").eq("employee_id",emp.id).is("clock_out",null).order("clock_in",{ascending:false}).limit(1);if(error)return document.getElementById("clockStatus").textContent=error.message;openEntry=data?.[0];document.getElementById("clockStatus").textContent=openEntry?"Clocked in since "+fmt(openEntry.clock_in):"You are currently clocked out.";document.getElementById("clockBtn").textContent=openEntry?"Hold 2 sec to Clock Out":"Hold 2 sec to Clock In";document.getElementById("clockHint").textContent="Press and hold for 2 seconds. Releasing early cancels it."}

let weekOffset=0;
const MS_DAY=86400000;
function localDateStart(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function payrollStart(base=new Date()){
 const d=localDateStart(base),day=d.getDay(),back=(day-3+7)%7;
 d.setDate(d.getDate()-back); return d;
}
function rangeForOffset(off){
 const start=payrollStart(); start.setDate(start.getDate()+off*7);
 const end=new Date(start); end.setDate(end.getDate()+7);
 return {start,end};
}
function hoursBetween(a,b){return Math.max(0,(new Date(b)-new Date(a))/3600000)}
function hoursText(h){return h.toFixed(2)+" hrs"}
function dateLabel(d){return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}
async function loadHours(){
 if(!emp)return;
 const {start,end}=rangeForOffset(weekOffset);
 const {data,error}=await lcs.from("time_entries").select("id,clock_in,clock_out").eq("employee_id",emp.id).gte("clock_in",start.toISOString()).lt("clock_in",end.toISOString()).order("clock_in",{ascending:true});
 const title=document.getElementById("weekTitle"),list=document.getElementById("hoursList"),totalEl=document.getElementById("weekTotal");
 title.innerHTML=`<b>${dateLabel(start)} – ${dateLabel(new Date(end.getTime()-MS_DAY))}</b>`;
 if(error){list.textContent=error.message;totalEl.textContent="";return}
 const rows=data||[],days=new Map(),now=new Date();
 rows.forEach(x=>{const ci=new Date(x.clock_in),co=x.clock_out?new Date(x.clock_out):now,key=ci.toLocaleDateString();const h=hoursBetween(ci,co);if(!days.has(key))days.set(key,{date:ci,hours:0,shifts:[]});const d=days.get(key);d.hours+=h;d.shifts.push({ci,co,open:!x.clock_out,h})});
 let total=0;
 list.innerHTML=days.size?[...days.values()].map(d=>{total+=d.hours;return `<div class=row><b>${dateLabel(d.date)}</b> — ${hoursText(d.hours)}<br>${d.shifts.map(x=>`${x.ci.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})} – ${x.open?"Still clocked in":x.co.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})} (${hoursText(x.h)})`).join("<br>")}</div>`}).join(""):"<p>No time punches this week.</p>";
 totalEl.textContent="Week total: "+hoursText(total);
 document.getElementById("nextWeek").disabled=weekOffset>=0;
}
document.getElementById("prevWeek").addEventListener("click",()=>{if(weekOffset>-4){weekOffset--;loadHours()}});
document.getElementById("nextWeek").addEventListener("click",()=>{if(weekOffset<0){weekOffset++;loadHours()}});
document.getElementById("currentWeek").addEventListener("click",()=>{weekOffset=0;loadHours()});
let clockHoldTimer=null;
function startClockHold(e){
 e.preventDefault();
 const b=document.getElementById("clockBtn");
 if(b.disabled)return;
 b.textContent="Keep holding…";
 clockHoldTimer=setTimeout(async()=>{clockHoldTimer=null;b.textContent="Confirmed ✓";if(navigator.vibrate)navigator.vibrate(80);await toggleClock()},2000);
}
function cancelClockHold(e){
 if(e)e.preventDefault();
 if(clockHoldTimer){clearTimeout(clockHoldTimer);clockHoldTimer=null;refreshClock();}
}
function wireClockHold(){
 const b=document.getElementById("clockBtn");
 b.onclick=null;
 b.addEventListener("pointerdown",startClockHold);
 b.addEventListener("pointerup",cancelClockHold);
 b.addEventListener("pointercancel",cancelClockHold);
 b.addEventListener("pointerleave",cancelClockHold);
}
wireClockHold();
async function toggleClock(){document.getElementById("clockBtn").disabled=true;let error;if(openEntry){const ended=new Date(),worked=hoursBetween(openEntry.clock_in,ended);({error}=await lcs.from("time_entries").update({clock_out:ended.toISOString()}).eq("id",openEntry.id));if(!error)document.getElementById("shiftSummary").textContent="Shift complete: "+hoursText(worked)}else({error}=await lcs.from("time_entries").insert({employee_id:emp.id}));if(error)alert(error.message);await refreshClock();document.getElementById("clockBtn").disabled=false}
</script><script src="schedule-calendar.js?v=16"></script></body></html>
